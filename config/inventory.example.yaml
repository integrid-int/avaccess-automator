# Mapping profiles let you keep today's numeric split while preparing a future zone-based map.
mapping_profiles:
  active: numeric_v1
  profiles:
    numeric_v1:
      description: "Numeric split (today) — ENC-10 is spare"
      presets:
        1_all:
          description: "Encoder 1 broadcasts to all 35 TVs"
          routes:
            ENC-01:
              [
                RX-01, RX-02, RX-03, RX-04, RX-05, RX-06, RX-07, RX-08, RX-09, RX-10,
                RX-11, RX-12, RX-13, RX-14, RX-15, RX-16, RX-17, RX-18, RX-19, RX-20,
                RX-21, RX-22, RX-23, RX-24, RX-25, RX-26, RX-27, RX-28, RX-29, RX-30,
                RX-31, RX-32, RX-33, RX-34, RX-35,
              ]

        2_four_programs:
          description: "4 programs split evenly (ENC-01..ENC-04, 9/9/9/8)"
          routes:
            ENC-01: [RX-01, RX-02, RX-03, RX-04, RX-05, RX-06, RX-07, RX-08, RX-09]
            ENC-02: [RX-10, RX-11, RX-12, RX-13, RX-14, RX-15, RX-16, RX-17, RX-18]
            ENC-03: [RX-19, RX-20, RX-21, RX-22, RX-23, RX-24, RX-25, RX-26, RX-27]
            ENC-04: [RX-28, RX-29, RX-30, RX-31, RX-32, RX-33, RX-34, RX-35]

        3_nine_programs:
          description: "9 programs across 35 TVs (ENC-01..ENC-09, 4+4+4+4+4+4+4+4+3)"
          routes:
            ENC-01: [RX-01, RX-02, RX-03, RX-04]
            ENC-02: [RX-05, RX-06, RX-07, RX-08]
            ENC-03: [RX-09, RX-10, RX-11, RX-12]
            ENC-04: [RX-13, RX-14, RX-15, RX-16]
            ENC-05: [RX-17, RX-18, RX-19, RX-20]
            ENC-06: [RX-21, RX-22, RX-23, RX-24]
            ENC-07: [RX-25, RX-26, RX-27, RX-28]
            ENC-08: [RX-29, RX-30, RX-31, RX-32]
            ENC-09: [RX-33, RX-34, RX-35]

    # Copy numeric_v1 to zone_v1 later and edit RX lists by physical zone.
    # zone_v1:
    #   description: "Zone-aware split (future)"
    #   presets: {}
