  - { id: ENC-05, hostname: IPE935-REPLACE_ME, mac: REPLACE_ME, ip: 192.168.10.15, source_label: "Xumo-05" }
  - { id: ENC-06, hostname: IPE935-REPLACE_ME, mac: REPLACE_ME, ip: 192.168.10.16, source_label: "Xumo-06" }
  - { id: ENC-07, hostname: IPE935-REPLACE_ME, mac: REPLACE_ME, ip: 192.168.10.17, source_label: "Xumo-07" }
