# Device inventory for AVAccess 4KIP200 matrix
# Fill hostnames/MACs from VDirector or UDP discovery (ports 3335/3336).
# Hostname format: IPE935-<MAC> (TX) / IPD935-<MAC> (RX)

network:
  broadcast: "255.255.255.255"
  udp_switch_port: 5010
  telnet_port: 24

encoders:
  - { id: ENC-01, hostname: IPE935-REPLACE_ME, mac: REPLACE_ME, ip: 192.168.10.11, source_label: "Xumo-01" }
  - { id: ENC-02, hostname: IPE935-REPLACE_ME, mac: REPLACE_ME, ip: 192.168.10.12, source_label: "Xumo-02" }
