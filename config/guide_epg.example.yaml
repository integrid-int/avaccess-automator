# XMLTV → guide_epg.json builder config (ZIP 27403 Spectrum Gold / TV Platinum).
# Copy to config/guide_epg.yaml and point source at your XMLTV feed.
#
#   python3 scripts/avaccess/build_guide_epg.py \
#     --config config/guide_epg.yaml \
#     --out homeassistant/config/www/avaccess/guide_epg.json

timezone: America/New_York
zip_code: "27403"

# Local fixture for offline tests/demos. Prefer url + compression for operators:
# source:
#   url: "https://example.invalid/xmltv.xml.gz"
#   compression: gzip
source:
  file: tests/fixtures/guide_sample.xmltv
  compression: none

# Used to resolve sports-category channel numbers/names when sports_channel_numbers omitted.
lineup_file: config/spectrum_lineup_27403.json

sports_window_hours: 12

# Spectrum guide number → XMLTV channel id(s). First matching programmes win.
# Numbers match Greensboro Gold/Platinum snapshot (ESPN=17, ESPN2=16, locals 7/9/10/11).
channel_number_map:
  "7": ["fox.example"]        # stub: map WXLV/local as needed
  "9": []                     # WFMY CBS
  "10": []                    # WGHP FOX
  "11": []                    # WXII NBC
  "16": ["espn2.example"]     # ESPN2
  "17": ["espn.example"]      # ESPN
  "38": []                    # NBC Sports
  "51": []                    # FanDuel Sports Network South-Carolinas
  "52": []                    # Golf Channel
  "67": []                    # FanDuel Sports Network Southeast
  "302": []                   # ESPNews
  "306": []                   # MLB Network
  "308": []                   # NBA TV
  "310": []                   # NFL Network
  "312": []                   # NHL Network
  "315": []                   # CBS Sports Network
  "370": []                   # ESPNU
