# Offline XMLTV fixture for tests and demos. The operator config
# config/guide_epg.yaml grabs TV Passport instead of this file.
#
#   python3 scripts/avaccess/build_guide_epg.py \
#     --config config/guide_epg.yaml \
#     --out homeassistant/config/www/avaccess/guide_epg.json

timezone: America/New_York
zip_code: "27403"

# Local fixture for offline tests/demos. Prefer url + compression for operators:
# source:
#   url: "https://example.invalid/xmltv.xml.gz"
#   compression: gzip
source:
  file: tests/fixtures/guide_sample.xmltv
  compression: none

# DirecTV major (guide number) → XMLTV channel id(s). First matching programmes win.
channel_number_map:
  "4": ["fox.example"]       # WGHP FOX
  "2": []                    # WFMY CBS — fill with XMLTV id
  "12": []                   # WXII NBC
  "45": []                   # WXLV ABC
  "206": ["espn.example"]    # ESPN
  "207": []                  # ESPN2
  "400": []                  # FS1
  "245": []                  # TNT
  "705": []                  # NFL Sunday Ticket 1
