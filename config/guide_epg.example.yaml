# XMLTV → guide_epg.json builder config (ZIP 27403 Spectrum Gold / TV Platinum).
#
# Schedules Direct (recommended):
#   export SD_USERNAME=... SD_PASSWORD=...
#   cp config/schedules_direct.example.yaml config/schedules_direct.yaml
#   python3 scripts/avaccess/pull_schedules_direct.py --config config/schedules_direct.yaml --write-lineup-id
#   python3 scripts/avaccess/build_guide_epg.py --config config/guide_epg.yaml \
#     --out homeassistant/config/www/avaccess/guide_epg.json
#
# ESPN scoreboards → match games to Spectrum channels (broadcast network, then EPG title):
#   python3 scripts/avaccess/pull_sports_schedule.py
#   python3 scripts/avaccess/build_guide_epg.py --config config/guide_epg.yaml \
#     --out homeassistant/config/www/avaccess/guide_epg.json
# Offline demo fixture:
#   python3 scripts/avaccess/pull_sports_schedule.py --from-json tests/fixtures/sports_schedule_sample.json

timezone: America/New_York
zip_code: "27403"

# Prefer Schedules Direct cache when present; fall back to local fixture for offline tests.
source:
  file: config/cache/schedules_direct.xmltv
  compression: none
# Offline fallback:
# source:
#   file: tests/fixtures/guide_sample.xmltv
#   compression: none

lineup_file: config/spectrum_lineup_27403.json
sports_schedule_file: config/sports_schedule.json
sports_window_hours: 12

# Optional overrides. Empty / omitted numbers are auto-matched from XMLTV
# <display-name> onto spectrum_lineup_27403.json names when unique.
channel_number_map: {}
