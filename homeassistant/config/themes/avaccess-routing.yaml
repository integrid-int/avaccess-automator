# Matches the Sports Routing panel: graphite field, charcoal keys, blue latch.
Avaccess Routing:
  primary-color: "#0b5cab"
  accent-color: "#1470d4"
  primary-background-color: "#101010"
  secondary-background-color: "#1a1a1a"
  card-background-color: "#2a2a2a"
  ha-card-background: "#2a2a2a"
  ha-card-border-radius: "3px"
  ha-card-box-shadow: none
  ha-card-border-width: "0px"
  primary-text-color: "#f3f3f3"
  secondary-text-color: "#bdbdbd"
  text-primary-color: "#ffffff"
  disabled-text-color: "#6a6a6a"
  divider-color: "#242424"
  app-header-background-color: "#101010"
  app-header-text-color: "#f3f3f3"
  app-header-selection-bar-color: "#0b5cab"
  state-icon-color: "#c8c8c8"
  paper-item-icon-color: "#c8c8c8"
  paper-item-icon-active-color: "#ffffff"
  input-fill-color: "#1a1a1a"
  input-ink-color: "#f3f3f3"
  input-label-ink-color: "#bdbdbd"
  input-disabled-fill-color: "#141414"
  input-disabled-ink-color: "#6a6a6a"
  input-idle-line-color: "#333333"
  input-hover-line-color: "#0b5cab"
  input-dropdown-icon-color: "#c8c8c8"
  mdc-text-field-fill-color: "#1a1a1a"
  mdc-text-field-ink-color: "#f3f3f3"
  mdc-text-field-label-ink-color: "#bdbdbd"
  mdc-text-field-idle-line-color: "#333333"
  mdc-text-field-hover-line-color: "#0b5cab"
  mdc-select-fill-color: "#1a1a1a"
  mdc-select-ink-color: "#f3f3f3"
  mdc-select-label-ink-color: "#bdbdbd"
  mdc-select-dropdown-icon-color: "#c8c8c8"
  mdc-select-idle-line-color: "#333333"
  mdc-select-hover-line-color: "#0b5cab"
  mdc-theme-surface: "#2a2a2a"
  mdc-theme-primary: "#0b5cab"
  # HA 2026 form controls paint from these, not the older mdc fill vars.
  ha-color-form-background: "#1a1a1a"
  ha-color-form-background-hover: "#242424"
  ha-color-form-background-disabled: "#141414"
  ha-color-border-neutral-loud: "#333333"
  switch-checked-button-color: "#0b5cab"
  switch-checked-track-color: "#1470d4"
  table-row-background-color: "#1a1a1a"
  table-row-alternative-background-color: "#141414"
