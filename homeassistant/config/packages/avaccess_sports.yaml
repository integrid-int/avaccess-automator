# DirecTV sports rail refresh through the Selenium Standalone add-on.
#
# Install and start https://github.com/davida72/selenium-homeassistant so
# port 4444 is listening. This command does not curl DirecTV. It asks that
# browser for each upcoming day as Bars and Restaurants (customer type 20),
# then keeps public-viewing channels (plus Greensboro locals 2, 8, 12, and 45).
#
# shell_command runs inside the Home Assistant container, so 127.0.0.1 is not
# the add-on. Use the add-on's supervisor DNS name. The command is stopped
# after 60 seconds, so the pull fetches two days per WebDriver script instead
# of all eight at once. The Selenium add-on must already be running.

shell_command:
  avaccess_refresh_sports: >-
    python3 avaccess/scripts/directv_sports.py
    --pull
    --selenium http://14f65a56-selenium-standalone.local.hass.io:4444
    --ahead 8
    --zip 27403
    --out www/avaccess/sports_schedule.json
    > /config/avaccess/sports-refresh.log 2>&1

automation:
  - id: avaccess_refresh_sports_morning
    alias: AVAccess refresh DirecTV sports
    triggers:
      - trigger: time
        at: "06:00:00"
    actions:
      - action: shell_command.avaccess_refresh_sports
