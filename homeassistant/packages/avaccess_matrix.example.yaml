# Generated by scripts/generate_ha_bundle.py
# Place under Home Assistant packages and include via packages: !include_dir_named packages

input_select:
  avaccess_program:
    name: AVAccess Program
    options:
    - Program A
    - Program B
    - Program C
    - Program D
    - Program E
    - Program F
    - Program G
    - Program H
    - Program I
    initial: Program A
    icon: mdi:view-grid-plus
  avaccess_channel:
    name: AVAccess Channel
    options:
    - ESPN
    - ESPN2
    - FS1
    - TNT
    - WGHP FOX (Local)
    - WFMY CBS (Local)
    - WXII NBC (Local)
    - WXLV ABC (Local)
    - NFL A1
    - NFL A2
    - NFL A3
    - NFL A4
    - NFL S1
    - NFL S2
    - NFL S3
    - NFL S4
    - NFL S5
    - NFL S6
    - NFL S7
    - NFL S8
    - NFL S9
    initial: ESPN
    icon: mdi:television-guide
input_text:
  avaccess_target_rxs:
    name: AVAccess Target TVs
    max: 255
    initial: RX-01,RX-02
    icon: mdi:monitor-multiple
shell_command:
  avaccess_preset_1_all: python3 /config/avaccess/apply_preset.py --inventory /config/avaccess/config/inventory.yaml --profile
    numeric_v1 --preset 1_all
  avaccess_preset_2_four_programs: python3 /config/avaccess/apply_preset.py --inventory /config/avaccess/config/inventory.yaml
    --profile numeric_v1 --preset 2_four_programs
  avaccess_preset_3_nine_programs: python3 /config/avaccess/apply_preset.py --inventory /config/avaccess/config/inventory.yaml
    --profile numeric_v1 --preset 3_nine_programs
  avaccess_route_targets: python3 /config/avaccess/route_targets.py --inventory /config/avaccess/config/inventory.yaml --encoder
    "{{ encoder }}" --targets "{{ targets }}"
  avaccess_directv_tune: python3 /config/avaccess/directv_shef.py --config /config/avaccess/config/directv.yaml tune --encoder
    "{{ encoder }}" --channel "{{ channel }}"
  avaccess_directv_get_tuned: python3 /config/avaccess/directv_shef.py --config /config/avaccess/config/directv.yaml get-tuned
    --encoder "{{ encoder }}"
script:
  avaccess_preset_1_all:
    alias: AVAccess Preset 1_all
    mode: single
    sequence:
    - service: shell_command.avaccess_preset_1_all
  avaccess_preset_2_four_programs:
    alias: AVAccess Preset 2_four_programs
    mode: single
    sequence:
    - service: shell_command.avaccess_preset_2_four_programs
  avaccess_preset_3_nine_programs:
    alias: AVAccess Preset 3_nine_programs
    mode: single
    sequence:
    - service: shell_command.avaccess_preset_3_nine_programs
  avaccess_set_program:
    alias: AVAccess select program
    mode: single
    fields:
      program:
        description: Program key from program_to_encoder
        example: program_a
    variables:
      program_key_to_label:
        program_a: Program A
        program_b: Program B
        program_c: Program C
        program_d: Program D
        program_e: Program E
        program_f: Program F
        program_g: Program G
        program_h: Program H
        program_i: Program I
      program_label_to_key: &id001
        Program A: program_a
        Program B: program_b
        Program C: program_c
        Program D: program_d
        Program E: program_e
        Program F: program_f
        Program G: program_g
        Program H: program_h
        Program I: program_i
      program_key: '{% set raw = (program | default(states(''input_select.avaccess_program''), true)) | string %}{{ program_label_to_key[raw]
        if raw in program_label_to_key else raw | lower }}'
    sequence:
    - service: input_select.select_option
      data:
        entity_id: input_select.avaccess_program
        option: '{{ program_key_to_label[program_key] if program_key in program_key_to_label else program }}'
  avaccess_tune_channel:
    alias: AVAccess tune channel on source
    mode: queued
    fields:
      program:
        description: Program key (optional; uses selected program when omitted)
        example: program_a
      channel:
        description: Channel key from channels map
        example: espn
    variables:
      program_to_encoder: &id002
        program_a: ENC-01
        program_b: ENC-02
        program_c: ENC-03
        program_d: ENC-04
        program_e: ENC-05
        program_f: ENC-06
        program_g: ENC-07
        program_h: ENC-08
        program_i: ENC-09
      channels:
        espn:
          number: '206'
          label: ESPN
        espn2:
          number: '207'
          label: ESPN2
        fs1:
          number: '400'
          label: FS1
        tnt:
          number: '245'
          label: TNT
        fox:
          number: '4'
          label: WGHP FOX (Local)
        cbs:
          number: '2'
          label: WFMY CBS (Local)
        nbc:
          number: '12'
          label: WXII NBC (Local)
        abc:
          number: '45'
          label: WXLV ABC (Local)
        nfl_afternoon_game_1:
          number: '705'
          label: NFL A1
        nfl_afternoon_game_2:
          number: '706'
          label: NFL A2
        nfl_afternoon_game_3:
          number: '707'
          label: NFL A3
        nfl_afternoon_game_4:
          number: '708'
          label: NFL A4
        nfl_sunday_game_1:
          number: '705'
          label: NFL S1
        nfl_sunday_game_2:
          number: '706'
          label: NFL S2
        nfl_sunday_game_3:
          number: '707'
          label: NFL S3
        nfl_sunday_game_4:
          number: '708'
          label: NFL S4
        nfl_sunday_game_5:
          number: '709'
          label: NFL S5
        nfl_sunday_game_6:
          number: '710'
          label: NFL S6
        nfl_sunday_game_7:
          number: '711'
          label: NFL S7
        nfl_sunday_game_8:
          number: '712'
          label: NFL S8
        nfl_sunday_game_9:
          number: '713'
          label: NFL S9
      suffix_commands:
      - ok
      program_label_to_key: *id001
      channel_label_to_key:
        ESPN: espn
        ESPN2: espn2
        FS1: fs1
        TNT: tnt
        WGHP FOX (Local): fox
        WFMY CBS (Local): cbs
        WXII NBC (Local): nbc
        WXLV ABC (Local): abc
        NFL A1: nfl_afternoon_game_1
        NFL A2: nfl_afternoon_game_2
        NFL A3: nfl_afternoon_game_3
        NFL A4: nfl_afternoon_game_4
        NFL S1: nfl_sunday_game_1
        NFL S2: nfl_sunday_game_2
        NFL S3: nfl_sunday_game_3
        NFL S4: nfl_sunday_game_4
        NFL S5: nfl_sunday_game_5
        NFL S6: nfl_sunday_game_6
        NFL S7: nfl_sunday_game_7
        NFL S8: nfl_sunday_game_8
        NFL S9: nfl_sunday_game_9
      program_key: '{% set raw = (program | default(states(''input_select.avaccess_program''), true)) | string %}{{ program_label_to_key[raw]
        if raw in program_label_to_key else raw | lower }}'
      channel_key: '{% set raw = (channel | default(states(''input_select.avaccess_channel''), true)) | string %}{{ channel_label_to_key[raw]
        if raw in channel_label_to_key else raw | lower }}'
      selected_encoder: '{{ program_to_encoder[program_key] if program_key in program_to_encoder else none }}'
      channel_number: '{{ channels[channel_key][''number''] if channel_key in channels else none }}'
      digit_delay: '00:00:00.25'
      digit_delay_ms: 250
      suffix_text: '{{ suffix_commands | join('','') }}'
    sequence:
    - choose:
      - conditions: '{{ selected_encoder is not none and channel_number is not none }}'
        sequence:
        - service: shell_command.avaccess_directv_tune
          data:
            encoder: '{{ selected_encoder }}'
            channel: '{{ channel_number }}'
      default:
      - service: system_log.write
        data:
          level: warning
          message: AVAccess tune failed (directv_shef); check program/channel/H25 maps. program={{ program_key }} channel={{
            channel_key }}
  avaccess_tune_selected_channel:
    alias: AVAccess tune selected channel
    mode: single
    sequence:
    - service: script.avaccess_tune_channel
      data:
        channel: '{{ states(''input_select.avaccess_channel'') }}'
  avaccess_route_program_to_tvs:
    alias: AVAccess route program to TVs
    mode: single
    fields:
      program:
        description: Program key (optional; defaults to selected program)
        example: program_a
      targets:
        description: Receiver IDs/hostnames list (optional; defaults to input_text)
        example: RX-01,RX-02,RX-03
    variables:
      program_to_encoder: *id002
      program_label_to_key: *id001
      program_key: '{% set raw = (program | default(states(''input_select.avaccess_program''), true)) | string %}{{ program_label_to_key[raw]
        if raw in program_label_to_key else raw | lower }}'
      selected_encoder: '{{ program_to_encoder[program_key] if program_key in program_to_encoder else none }}'
      target_list: '{{ targets | default(states(''input_text.avaccess_target_rxs''), true) }}'
    sequence:
    - choose:
      - conditions: '{{ selected_encoder is not none and (target_list | string | trim) != '''' }}'
        sequence:
        - service: shell_command.avaccess_route_targets
          data:
            encoder: '{{ selected_encoder }}'
            targets: '{{ target_list }}'
      default:
      - service: system_log.write
        data:
          level: warning
          message: AVAccess route failed; check selected program and target TVs. program={{ program_key }} targets={{ target_list
            }}
  avaccess_route_selected_program_to_tvs:
    alias: AVAccess route selected program to TVs
    mode: single
    sequence:
    - service: script.avaccess_route_program_to_tvs
  avaccess_tune_espn:
    alias: AVAccess tune ESPN
    mode: single
    sequence:
    - service: input_select.select_option
      data:
        entity_id: input_select.avaccess_channel
        option: ESPN
    - service: script.avaccess_tune_selected_channel
  avaccess_tune_espn2:
    alias: AVAccess tune ESPN2
    mode: single
    sequence:
    - service: input_select.select_option
      data:
        entity_id: input_select.avaccess_channel
        option: ESPN2
    - service: script.avaccess_tune_selected_channel
  avaccess_tune_fs1:
    alias: AVAccess tune FS1
    mode: single
    sequence:
    - service: input_select.select_option
      data:
        entity_id: input_select.avaccess_channel
        option: FS1
    - service: script.avaccess_tune_selected_channel
  avaccess_tune_tnt:
    alias: AVAccess tune TNT
    mode: single
    sequence:
    - service: input_select.select_option
      data:
        entity_id: input_select.avaccess_channel
        option: TNT
    - service: script.avaccess_tune_selected_channel
  avaccess_tune_fox:
    alias: AVAccess tune WGHP FOX (Local)
    mode: single
    sequence:
    - service: input_select.select_option
      data:
        entity_id: input_select.avaccess_channel
        option: WGHP FOX (Local)
    - service: script.avaccess_tune_selected_channel
  avaccess_tune_cbs:
    alias: AVAccess tune WFMY CBS (Local)
    mode: single
    sequence:
    - service: input_select.select_option
      data:
        entity_id: input_select.avaccess_channel
        option: WFMY CBS (Local)
    - service: script.avaccess_tune_selected_channel
  avaccess_tune_nbc:
    alias: AVAccess tune WXII NBC (Local)
    mode: single
    sequence:
    - service: input_select.select_option
      data:
        entity_id: input_select.avaccess_channel
        option: WXII NBC (Local)
    - service: script.avaccess_tune_selected_channel
  avaccess_tune_abc:
    alias: AVAccess tune WXLV ABC (Local)
    mode: single
