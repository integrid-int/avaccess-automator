    - service: script.avaccess_tune_channel
      data:
        program: program_a
        channel: nfl_afternoon_game_1
    - service: script.avaccess_tune_channel
      data:
        program: program_b
        channel: nfl_afternoon_game_2
    - service: script.avaccess_tune_channel
      data:
