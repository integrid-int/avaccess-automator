# Generated by scripts/generate_ha_bundle.py
# Place under Home Assistant packages and include via packages: !include_dir_named packages

input_select:
  avaccess_program:
    name: AVAccess Program
    options:
    - program_a
    - program_b
    - program_c
    - program_d
    - program_e
    - program_f
    - program_g
    - program_h
    - program_i
    initial: program_a
    icon: mdi:view-grid-plus
  avaccess_channel:
    name: AVAccess Channel
    options:
    - espn
    - tnt
    - fox
    - cbs
    - nfl_afternoon_game_1
    - nfl_afternoon_game_2
    - nfl_afternoon_game_3
    - nfl_afternoon_game_4
    - nfl_sunday_game_1
    - nfl_sunday_game_2
    - nfl_sunday_game_3
    - nfl_sunday_game_4
    - nfl_sunday_game_5
    - nfl_sunday_game_6
    - nfl_sunday_game_7
    - nfl_sunday_game_8
    - nfl_sunday_game_9
    initial: espn
    icon: mdi:television-guide
shell_command:
  avaccess_preset_1_all: python3 /config/avaccess/scripts/apply_preset.py --inventory /config/avaccess/config/inventory.yaml
    --profile numeric_v1 --preset 1_all
  avaccess_preset_2_four_programs: python3 /config/avaccess/scripts/apply_preset.py --inventory /config/avaccess/config/inventory.yaml
    --profile numeric_v1 --preset 2_four_programs
  avaccess_preset_3_nine_programs: python3 /config/avaccess/scripts/apply_preset.py --inventory /config/avaccess/config/inventory.yaml
    --profile numeric_v1 --preset 3_nine_programs
script:
  avaccess_preset_1_all:
    alias: AVAccess Preset 1_all
    mode: single
    sequence:
    - service: shell_command.avaccess_preset_1_all
  avaccess_preset_2_four_programs:
    alias: AVAccess Preset 2_four_programs
    mode: single
    sequence:
    - service: shell_command.avaccess_preset_2_four_programs
  avaccess_preset_3_nine_programs:
    alias: AVAccess Preset 3_nine_programs
    mode: single
    sequence:
    - service: shell_command.avaccess_preset_3_nine_programs
  avaccess_set_program:
    alias: AVAccess select program
    mode: single
    fields:
      program:
        description: Program key from program_to_encoder
        example: program_a
    sequence:
    - service: input_select.select_option
      data:
        entity_id: input_select.avaccess_program
        option: '{{ program }}'
  avaccess_tune_channel:
    alias: AVAccess tune channel on Xumo
    mode: queued
    fields:
      program:
        description: Program key (optional; uses selected program when omitted)
        example: program_a
      channel:
        description: Channel key from channels map
        example: espn
    variables:
      program_to_encoder:
        program_a: ENC-01
        program_b: ENC-02
        program_c: ENC-03
        program_d: ENC-04
        program_e: ENC-05
        program_f: ENC-06
        program_g: ENC-07
        program_h: ENC-08
        program_i: ENC-09
      encoder_ir_entity:
        ENC-01: remote.xumo_01_ir
        ENC-02: remote.xumo_02_ir
        ENC-03: remote.xumo_03_ir
        ENC-04: remote.xumo_04_ir
        ENC-05: remote.xumo_05_ir
        ENC-06: remote.xumo_06_ir
        ENC-07: remote.xumo_07_ir
        ENC-08: remote.xumo_08_ir
        ENC-09: remote.xumo_09_ir
      channels:
        espn:
          number: '206'
          label: ESPN
        tnt:
          number: '245'
          label: TNT
        fox:
          number: '4'
          label: FOX
        cbs:
          number: '2'
          label: CBS
        nfl_afternoon_game_1:
          number: '705'
          label: NFL A1
        nfl_afternoon_game_2:
          number: '706'
          label: NFL A2
        nfl_afternoon_game_3:
          number: '707'
          label: NFL A3
        nfl_afternoon_game_4:
          number: '708'
          label: NFL A4
        nfl_sunday_game_1:
          number: '705'
          label: NFL S1
        nfl_sunday_game_2:
          number: '706'
          label: NFL S2
        nfl_sunday_game_3:
          number: '707'
          label: NFL S3
        nfl_sunday_game_4:
          number: '708'
          label: NFL S4
        nfl_sunday_game_5:
          number: '709'
          label: NFL S5
        nfl_sunday_game_6:
          number: '710'
          label: NFL S6
        nfl_sunday_game_7:
          number: '711'
          label: NFL S7
        nfl_sunday_game_8:
          number: '712'
          label: NFL S8
        nfl_sunday_game_9:
          number: '713'
          label: NFL S9
      suffix_commands:
      - ok
      program_key: '{{ (program | default(states(''input_select.avaccess_program''), true)) | lower }}'
      channel_key: '{{ (channel | default(states(''input_select.avaccess_channel''), true)) | lower }}'
      selected_encoder: '{{ program_to_encoder[program_key] if program_key in program_to_encoder else none }}'
      remote_entity: '{{ encoder_ir_entity[selected_encoder] if selected_encoder in encoder_ir_entity else none }}'
      channel_number: '{{ channels[channel_key][''number''] if channel_key in channels else none }}'
      digit_delay: '00:00:00.25'
    sequence:
    - choose:
      - conditions: '{{ remote_entity is not none and channel_number is not none }}'
        sequence:
        - repeat:
            for_each: '{{ (channel_number | string | list) + suffix_commands }}'
            sequence:
            - service: remote.send_command
              data:
                entity_id: '{{ remote_entity }}'
                command: '{{ repeat.item }}'
            - delay: '{{ digit_delay }}'
      default:
      - service: system_log.write
        data:
          level: warning
          message: AVAccess tune failed; check program/channel maps. program={{ program_key }} channel={{ channel_key }}
  avaccess_tune_selected_channel:
    alias: AVAccess tune selected channel
    mode: single
    sequence:
    - service: script.avaccess_tune_channel
      data:
        channel: '{{ states(''input_select.avaccess_channel'') }}'
  avaccess_tune_espn:
    alias: AVAccess tune ESPN
    mode: single
