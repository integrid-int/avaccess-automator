# Generated by scripts/generate_ha_bundle.py
# Place under Home Assistant packages and include via packages: !include_dir_named packages

input_select:
  avaccess_program:
    name: AVAccess Program
    options:
    - program_a
    - program_b
    - program_c
    - program_d
    - program_e
    - program_f
    - program_g
    - program_h
    - program_i
    initial: program_a
    icon: mdi:view-grid-plus
  avaccess_channel:
    name: AVAccess Channel
    options:
    - espn
    - espn2
    - fs1
    - tnt
    - fox
    - cbs
    - nbc
    - abc
    - nfl_afternoon_game_1
    - nfl_afternoon_game_2
    - nfl_afternoon_game_3
    - nfl_afternoon_game_4
    - nfl_sunday_game_1
    - nfl_sunday_game_2
    - nfl_sunday_game_3
    - nfl_sunday_game_4
    - nfl_sunday_game_5
    - nfl_sunday_game_6
    - nfl_sunday_game_7
    - nfl_sunday_game_8
    - nfl_sunday_game_9
    initial: espn
    icon: mdi:television-guide
input_text:
  avaccess_target_rxs:
    name: AVAccess Target TVs
    max: 255
    initial: RX-01,RX-02
    icon: mdi:television-multiple
shell_command:
  avaccess_preset_1_all: python3 /config/avaccess/scripts/apply_preset.py --inventory /config/avaccess/config/inventory.yaml
    --profile numeric_v1 --preset 1_all
  avaccess_preset_2_four_programs: python3 /config/avaccess/scripts/apply_preset.py --inventory /config/avaccess/config/inventory.yaml
    --profile numeric_v1 --preset 2_four_programs
  avaccess_preset_3_nine_programs: python3 /config/avaccess/scripts/apply_preset.py --inventory /config/avaccess/config/inventory.yaml
    --profile numeric_v1 --preset 3_nine_programs
  avaccess_route_targets: python3 /config/avaccess/scripts/route_targets.py --inventory /config/avaccess/config/inventory.yaml
    --encoder "{{ encoder }}" --targets "{{ targets }}"
  avaccess_itach_send_channel: python3 /config/avaccess/scripts/send_xumo_ir_itach.py --itach-config /config/avaccess/config/itach.yaml
    --encoder "{{ encoder }}" --digits "{{ digits }}" --suffix "{{ suffix }}" --digit-delay-ms {{ digit_delay_ms }}
script:
  avaccess_preset_1_all:
    alias: AVAccess Preset 1_all
    mode: single
    sequence:
    - service: shell_command.avaccess_preset_1_all
  avaccess_preset_2_four_programs:
    alias: AVAccess Preset 2_four_programs
    mode: single
    sequence:
    - service: shell_command.avaccess_preset_2_four_programs
  avaccess_preset_3_nine_programs:
    alias: AVAccess Preset 3_nine_programs
    mode: single
    sequence:
    - service: shell_command.avaccess_preset_3_nine_programs
  avaccess_set_program:
    alias: AVAccess select program
    mode: single
    fields:
      program:
        description: Program key from program_to_encoder
        example: program_a
    sequence:
    - service: input_select.select_option
      data:
        entity_id: input_select.avaccess_program
        option: '{{ program }}'
  avaccess_tune_channel:
    alias: AVAccess tune channel on Xumo
    mode: queued
    fields:
      program:
        description: Program key (optional; uses selected program when omitted)
        example: program_a
      channel:
        description: Channel key from channels map
        example: espn
    variables:
      program_to_encoder: &id001
        program_a: ENC-01
        program_b: ENC-02
        program_c: ENC-03
        program_d: ENC-04
        program_e: ENC-05
        program_f: ENC-06
        program_g: ENC-07
        program_h: ENC-08
        program_i: ENC-09
      channels:
        espn:
          number: '206'
          label: ESPN
        espn2:
          number: '207'
          label: ESPN2
        fs1:
          number: '400'
          label: FS1
        tnt:
          number: '245'
          label: TNT
        fox:
          number: '4'
          label: WGHP FOX (Local)
        cbs:
          number: '2'
          label: WFMY CBS (Local)
        nbc:
          number: '12'
          label: WXII NBC (Local)
        abc:
          number: '45'
          label: WXLV ABC (Local)
        nfl_afternoon_game_1:
          number: '705'
          label: NFL A1
        nfl_afternoon_game_2:
          number: '706'
          label: NFL A2
        nfl_afternoon_game_3:
          number: '707'
          label: NFL A3
        nfl_afternoon_game_4:
          number: '708'
          label: NFL A4
        nfl_sunday_game_1:
          number: '705'
          label: NFL S1
        nfl_sunday_game_2:
          number: '706'
          label: NFL S2
        nfl_sunday_game_3:
          number: '707'
          label: NFL S3
        nfl_sunday_game_4:
          number: '708'
          label: NFL S4
        nfl_sunday_game_5:
          number: '709'
          label: NFL S5
        nfl_sunday_game_6:
          number: '710'
          label: NFL S6
        nfl_sunday_game_7:
          number: '711'
          label: NFL S7
        nfl_sunday_game_8:
          number: '712'
          label: NFL S8
        nfl_sunday_game_9:
          number: '713'
          label: S9 NFL Slot
      suffix_commands:
      - ok
      program_key: '{{ (program | default(states(''input_select.avaccess_program''), true)) | lower }}'
      channel_key: '{{ (channel | default(states(''input_select.avaccess_channel''), true)) | lower }}'
      selected_encoder: '{{ program_to_encoder[program_key] if program_key in program_to_encoder else none }}'
      channel_number: '{{ channels[channel_key][''number''] if channel_key in channels else none }}'
      digit_delay: '00:00:00.25'
      digit_delay_ms: 250
      suffix_text: '{{ suffix_commands | join('','') }}'
    sequence:
    - choose:
      - conditions: '{{ selected_encoder is not none and channel_number is not none }}'
        sequence:
        - service: shell_command.avaccess_itach_send_channel
          data:
            encoder: '{{ selected_encoder }}'
            digits: '{{ channel_number }}'
            suffix: '{{ suffix_text }}'
            digit_delay_ms: '{{ digit_delay_ms }}'
      default:
      - service: system_log.write
        data:
          level: warning
          message: AVAccess tune failed (itach_tcp); check program/channel/itach maps. program={{ program_key }} channel={{
            channel_key }}
  avaccess_tune_selected_channel:
    alias: AVAccess tune selected channel
    mode: single
    sequence:
    - service: script.avaccess_tune_channel
      data:
        channel: '{{ states(''input_select.avaccess_channel'') }}'
  avaccess_route_program_to_tvs:
    alias: AVAccess route program to TVs
    mode: single
    fields:
      program:
        description: Program key (optional; defaults to selected program)
        example: program_a
      targets:
        description: Receiver IDs/hostnames list (optional; defaults to input_text)
        example: RX-01,RX-02,RX-03
    variables:
      program_to_encoder: *id001
      program_key: '{{ (program | default(states(''input_select.avaccess_program''), true)) | lower }}'
      selected_encoder: '{{ program_to_encoder[program_key] if program_key in program_to_encoder else none }}'
      target_list: '{{ targets | default(states(''input_text.avaccess_target_rxs''), true) }}'
    sequence:
    - choose:
      - conditions: '{{ selected_encoder is not none and (target_list | string | trim) != '''' }}'
        sequence:
        - service: shell_command.avaccess_route_targets
          data:
            encoder: '{{ selected_encoder }}'
            targets: '{{ target_list }}'
      default:
      - service: system_log.write
        data:
          level: warning
          message: AVAccess route failed; check selected program and target TVs. program={{ program_key }} targets={{ target_list
            }}
  avaccess_route_selected_program_to_tvs:
    alias: AVAccess route selected program to TVs
    mode: single
    sequence:
    - service: script.avaccess_route_program_to_tvs
  avaccess_tune_espn:
    alias: AVAccess tune ESPN
    mode: single
    sequence:
    - service: input_select.select_option
      data:
        entity_id: input_select.avaccess_channel
        option: espn
    - service: script.avaccess_tune_selected_channel
  avaccess_tune_espn2:
