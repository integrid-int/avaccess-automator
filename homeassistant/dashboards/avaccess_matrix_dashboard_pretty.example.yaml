# AVAccess iPad dashboard (polished example)
# Copy into a Lovelace dashboard YAML file, then adjust entities/sensors as needed.

title: AVAccess Matrix
views:
- title: Control
  path: av-control
  icon: mdi:video-input-component
  badges: []
  cards:
  - type: markdown
    content: '## AVAccess Matrix

      Tap a **Favorite** for one-step game-day routing, or use Preset → Program → Channel. Local blackout handling is supported
      via weekly sync for ZIP **27403**.

      '
  - type: entities
    title: Active Selection
    show_header_toggle: false
    entities:
    - entity: input_select.avaccess_program
      name: Active Program
    - entity: input_select.avaccess_channel
      name: Active Channel
    - entity: input_text.avaccess_target_rxs
      name: Target TVs (RX IDs)
  - type: grid
    title: Route Actions
    columns: 2
    square: false
    cards:
    - type: button
      name: Tune Selected Program
      icon: mdi:remote-tv
      tap_action:
        action: call-service
        service: script.avaccess_tune_selected_channel
    - type: button
      name: Route Program → TVs
      icon: mdi:monitor-multiple
      tap_action:
        action: call-service
        service: script.avaccess_route_selected_program_to_tvs
  - type: grid
    title: Favorites
    columns: 3
    square: false
    cards:
    - type: button
      name: FOX
      icon: mdi:star
      show_state: false
      tap_action:
        action: call-service
        service: script.avaccess_favorite_fox
    - type: button
      name: NFL Afternoon Games
      icon: mdi:star
      show_state: false
      tap_action:
        action: call-service
        service: script.avaccess_favorite_nfl_afternoon_games
    - type: button
      name: All NFL Sunday Games
      icon: mdi:star
      show_state: false
      tap_action:
        action: call-service
        service: script.avaccess_favorite_all_nfl_sunday_games
  - type: grid
    title: Presets
    columns: 3
    square: false
    cards:
    - type: button
      name: ALL
      icon: mdi:video-switch
      tap_action:
        action: call-service
        service: script.avaccess_preset_1_all
    - type: button
      name: 4 Programs
      icon: mdi:video-switch
      tap_action:
        action: call-service
        service: script.avaccess_preset_2_four_programs
    - type: button
      name: 9 Programs
      icon: mdi:video-switch
      tap_action:
        action: call-service
        service: script.avaccess_preset_3_nine_programs
  - type: grid
    title: Programs
    columns: 3
    square: true
    cards:
    - type: button
      name: Program A
      icon: mdi:monitor-dashboard
      tap_action: &id001
        action: call-service
        service: script.avaccess_set_program
        data:
          program: program_a
      visibility:
      - condition: state
        entity: input_select.avaccess_program
        state_not: Program A
    - type: button
      name: Program A
      icon: mdi:check-circle
      tap_action: *id001
      visibility:
      - condition: state
        entity: input_select.avaccess_program
        state: Program A
    - type: button
      name: Program B
      icon: mdi:monitor-dashboard
