        data:
          program: program_f
    - type: button
      name: program_g
      icon: mdi:monitor-dashboard
      tap_action:
        action: call-service
        service: script.avaccess_set_program
        data:
          program: program_g
    - type: button
      name: program_h
      icon: mdi:monitor-dashboard
      tap_action:
        action: call-service
        service: script.avaccess_set_program
        data:
          program: program_h
    - type: button
      name: program_i
      icon: mdi:monitor-dashboard
      tap_action:
        action: call-service
        service: script.avaccess_set_program
        data:
          program: program_i
  - type: grid
    title: Channels
    columns: 4
    square: false
    cards:
    - type: button
      name: ESPN
      icon: mdi:television-play
      tap_action:
        action: call-service
