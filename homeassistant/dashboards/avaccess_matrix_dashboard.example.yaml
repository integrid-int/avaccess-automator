# Generated by scripts/generate_ha_bundle.py
# Import into Lovelace (Raw configuration editor) or dashboard YAML mode

title: AVAccess Matrix
views:
- title: AV Control
  path: av-control
  icon: mdi:video-input-component
  cards:
  - type: entities
    title: Active Selection
    entities:
    - input_select.avaccess_program
    - input_select.avaccess_channel
    - input_text.avaccess_target_rxs
  - type: grid
    title: Favorites
    columns: 3
    square: false
    cards:
    - type: button
      name: FOX Local
      icon: mdi:star
      tap_action:
        action: call-service
        service: script.avaccess_favorite_fox
    - type: button
      name: NFL Afternoon Games
      icon: mdi:star
      tap_action:
        action: call-service
        service: script.avaccess_favorite_nfl_afternoon_games
    - type: button
      name: All NFL Sunday Games
      icon: mdi:star
      tap_action:
        action: call-service
        service: script.avaccess_favorite_all_nfl_sunday_games
  - type: grid
    title: Presets
    columns: 3
    square: false
    cards:
    - type: button
      name: 1_all
      icon: mdi:video-switch
      tap_action:
        action: call-service
        service: script.avaccess_preset_1_all
    - type: button
      name: 2_four_programs
      icon: mdi:video-switch
      tap_action:
        action: call-service
        service: script.avaccess_preset_2_four_programs
    - type: button
      name: 3_nine_programs
      icon: mdi:video-switch
      tap_action:
        action: call-service
        service: script.avaccess_preset_3_nine_programs
  - type: grid
    title: Programs
    columns: 3
    square: false
    cards:
    - type: button
      name: program_a
      icon: mdi:monitor-dashboard
      tap_action:
        action: call-service
        service: script.avaccess_set_program
        data:
          program: program_a
    - type: button
      name: program_b
      icon: mdi:monitor-dashboard
      tap_action:
        action: call-service
        service: script.avaccess_set_program
        data:
          program: program_b
    - type: button
      name: program_c
      icon: mdi:monitor-dashboard
      tap_action:
        action: call-service
        service: script.avaccess_set_program
        data:
          program: program_c
    - type: button
      name: program_d
      icon: mdi:monitor-dashboard
      tap_action:
        action: call-service
        service: script.avaccess_set_program
        data:
          program: program_d
    - type: button
      name: program_e
